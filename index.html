<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ultimate Draft Order</title>
  <link rel="stylesheet" href="css/style.css?v=20261010b" />
</head>
<body>
  <header class="app-header">
    <h1>Ultimate Draft Order</h1>
  </header>

  <div id="fake-banner" class="fake-banner" hidden>Fake Mode — scrambled practice data. Nothing here is saved.</div>

  <main class="app-main">
    <section id="panel-draft" class="tab-panel active" aria-label="Draft List"></section>
    <section id="panel-myteam" class="tab-panel" aria-label="My Team"></section>
    <section id="panel-drafted" class="tab-panel" aria-label="Draft Board"></section>
    <section id="panel-notes" class="tab-panel" aria-label="Notes"></section>
    <section id="panel-sources" class="tab-panel" aria-label="Data Sources"></section>
  </main>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="draft">
      <span class="tab-icon">📝</span>
      <span class="tab-label">Draft List</span>
    </button>
    <button class="tab-btn" data-tab="myteam">
      <span class="tab-icon">🎽</span>
      <span class="tab-label">My Team</span>
    </button>
    <button class="tab-btn" data-tab="drafted">
      <span class="tab-icon">📋</span>
      <span class="tab-label">Draft Board</span>
    </button>
    <button class="tab-btn" data-tab="notes">
      <span class="tab-icon">🗒️</span>
      <span class="tab-label">Notes</span>
    </button>
    <button class="tab-btn" data-tab="sources">
      <span class="tab-icon">🔗</span>
      <span class="tab-label">Sources</span>
    </button>
  </nav>

  <script src="js/constants.js?v=20261010b"></script>

  <script src="js/app.js?v=20261010b"></script>
  <script src="js/playerDetail.js?v=20261010b"></script>

  <script src="js/teamFilter.js?v=20261010b"></script>
  <script src="js/seasonStatsView.js?v=20261010b"></script>
  <script src="js/lineup.js?v=20261010b"></script>
  <script src="js/tabs/draft.js?v=20261010b"></script>
  <script src="js/tabs/myTeam.js?v=20261010b"></script>

  <script src="js/tabs/sources.js?v=20261010b"></script>
